# Prueba y compila cada laboratorio, y publica todos en GitHub Pages en cada push a main.
#   web_lab7_celula_mecanizado    -> raíz del sitio
#   web_lab8_alimentos_del_valle  -> /lab8/
#   web_parcial10_giro_temporizado -> /parcial10/
# Requisito único (una sola vez): Settings → Pages → Source: "GitHub Actions".
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web_lab7_celula_mecanizado/package-lock.json
            web_lab8_alimentos_del_valle/package-lock.json
            web_parcial10_giro_temporizado/package-lock.json

      - name: Laboratorio 7 - instalar dependencias
        working-directory: web_lab7_celula_mecanizado
        run: npm ci

      - name: Laboratorio 7 - pruebas unitarias
        working-directory: web_lab7_celula_mecanizado
        run: npm test

      - name: Laboratorio 7 - compilar
        working-directory: web_lab7_celula_mecanizado
        run: npm run build

      - name: Laboratorio 8 - instalar dependencias
        working-directory: web_lab8_alimentos_del_valle
        run: npm ci

      - name: Laboratorio 8 - pruebas unitarias
        working-directory: web_lab8_alimentos_del_valle
        run: npm test

      - name: Laboratorio 8 - compilar
        working-directory: web_lab8_alimentos_del_valle
        run: npm run build

      - name: Parcial 10 - instalar dependencias
        working-directory: web_parcial10_giro_temporizado
        run: npm ci

      - name: Parcial 10 - pruebas unitarias
        working-directory: web_parcial10_giro_temporizado
        run: npm test

      - name: Parcial 10 - compilar
        working-directory: web_parcial10_giro_temporizado
        run: npm run build

      - name: Reunir los sitios (lab 7 en la raíz, lab 8 en /lab8/ y parcial 10 en /parcial10/)
        run: |
          cp -r web_lab7_celula_mecanizado/dist _site
          cp -r web_lab8_alimentos_del_valle/dist _site/lab8
          cp -r web_parcial10_giro_temporizado/dist _site/parcial10

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir el artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
